<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceny Elektřiny Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        canvas { background: #1e1e1e; border-radius: 8px; padding: 10px; }
        h1 { text-align: center; color: #00e676; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .card { background: #252525; padding: 15px; border-radius: 8px; text-align: center; width: 30%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ceny Elektřiny (EUR/MWh)</h1>
        <div class="stats" id="stats">
            <div class="card"><h3>Aktuální</h3><p id="curr">-</p></div>
            <div class="card"><h3>Baterie</h3><p id="bat">-</p></div>
            <div class="card"><h3>Výkup</h3><p id="sell">-</p></div>
        </div>
        <canvas id="priceChart"></canvas>
    </div>

    <script>
        const csvUrl = 'ceny_final_5min.csv';

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            delimiter: ";",
            complete: function(results) {
                const data = results.data.filter(r => r.Datum);
                const labels = data.map(r => `${r.Datum} ${r.Cas}`);
                const spot = data.map(r => parseFloat(r.Cena_Spot.replace(',', '.')));
                const konecna = data.map(r => parseFloat(r.Cena_Konecna.replace(',', '.')));
                const bat = data.map(r => parseFloat(r.Cena_Bat.replace(',', '.')));
                const sell = data.map(r => parseFloat(r.Sell.replace(',', '.')));

                // Aktualizace karet s poslední hodnotou
                document.getElementById('curr').innerText = konecna[0] + " €";
                document.getElementById('bat').innerText = bat[0] + " €";
                document.getElementById('sell').innerText = sell[0] + " €";

                new Chart(document.getElementById('priceChart'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: 'Cena Konečná', data: konecna, borderColor: '#00e676', fill: false, borderWidth: 2 },
                            { label: 'Cena Baterie', data: bat, borderColor: '#ff9800', borderDash: [5, 5], fill: false },
                            { label: 'Výkup (Sell)', data: sell, borderColor: '#2196f3', fill: true, backgroundColor: 'rgba(33, 150, 243, 0.1)' }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: { x: { display: false }, y: { grid: { color: '#333' } } },
                        plugins: { legend: { labels: { color: 'white' } } }
                    }
                });
            }
        });
    </script>
</body>
</html>
